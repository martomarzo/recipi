services:
  app:
    build: .
    ports:
      # Acceso directo por LAN (http://IP:3000)
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/app.db
      - SECRET_KEY=${SECRET_KEY:?definir en .env}
      - REGISTRATION_OPEN=${REGISTRATION_OPEN:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-}
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Sidecar de Tailscale: comparte la red de la app y la publica en el
  # tailnet con HTTPS (https://recipi.<tailnet>.ts.net) vía `tailscale
  # serve`. Autenticación: TS_AUTHKEY en .env, o abrir una vez el link
  # que aparece en `docker compose logs tailscale`. Si el sidecar cae,
  # el acceso por LAN no se ve afectado.
  tailscale:
    image: tailscale/tailscale:latest
    network_mode: service:app
    depends_on:
      - app
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=recipi
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    restart: unless-stopped
